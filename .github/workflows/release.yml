# The release (docs/release.md). The toolchains are built and tested on the maintainer's machine, not in CI. The
# maintainer uploads one gcc-arm-none-eabi-<major>-<minor>-<patch>.tar.xz for each GCC in
# compilers/arm-none-eabi/versions.inc to a DRAFT release named for the tag, then pushes the signed tag vX.Y.Z.
# This workflow completes that draft: it checks docs/release/vX.Y.Z.md and the archives, adds SHA256SUMS, and writes
# the notes: the hand-written highlights, a list of what is in the release, then GitHub's generated list of the pull
# requests since the previous published release (grouped by .github/release.yml; none for the first release). The
# release stays a draft until the maintainer reviews it and presses Publish. Re-run it for an existing tag from the
# Actions tab (workflow_dispatch). It builds nothing, so it takes a minute.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'An existing tag, e.g. v0.1.0'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  draft:
    name: complete the draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Release notes present
        run: test -f "docs/release/${TAG}.md" || { echo "docs/release/${TAG}.md is missing"; exit 1; }

      # The archives are the maintainer's; this only checks that the draft holds the ones versions.inc asks for
      - name: Check the draft
        run: |
          inc=compilers/arm-none-eabi/versions.inc
          var() { sed -n "s/^$1 *[?:]*= *//p" "${inc}" | head -1; }
          gh release view "${TAG}" >/dev/null 2>&1 || { echo "No release for ${TAG}: create a draft and upload the archives first (docs/release.md)"; exit 1; }
          [ "$(gh release view "${TAG}" --json isDraft --jq .isDraft)" = true ] || { echo "The release for ${TAG} is published already"; exit 1; }
          have=$(gh release view "${TAG}" --json assets --jq '.assets[].name')
          missing=0
          for version in $(var GCC_VERSIONS); do
            archive="gcc-arm-none-eabi-${version//./-}.tar.xz"
            echo "${have}" | grep -qx "${archive}" || { echo "The draft has no ${archive}"; missing=1; }
          done
          exit ${missing}

      - name: Checksums
        run: |
          mkdir dist
          gh release download "${TAG}" --pattern 'gcc-arm-none-eabi-*.tar.xz' --dir dist
          cd dist || exit 1
          sha256sum *.tar.xz >SHA256SUMS
          cat SHA256SUMS
          gh release upload "${TAG}" SHA256SUMS --clobber

      # What the release holds, from versions.inc at the tag: the hand-written highlights come first
      - name: Notes
        run: |
          inc=compilers/arm-none-eabi/versions.inc
          var() { sed -n "s/^$1 *[?:]*= *//p" "${inc}" | head -1; }
          {
            cat "docs/release/${TAG}.md"
            echo
            echo "## Contents"
            echo
            echo "| Toolchain | Archive |"
            echo "|---|---|"
            for version in $(var GCC_VERSIONS); do
              echo "| arm-none-eabi GCC ${version} | \`gcc-arm-none-eabi-${version//./-}.tar.xz\` |"
            done
            echo
            libc=$(var RTOSKIT_LIBC_VERSION)
            [ -z "${libc}" ] || echo "Built with [rtoskit-libc ${libc}](https://github.com/sgstreet/rtoskit-libc/releases/tag/v${libc})."
            echo "Check an archive with \`sha256sum -c SHA256SUMS\`. The archives were built and tested on the maintainer's machine; the tag is signed."
            # The pull requests since the previous published release follow the hand-written notes; the first
            # release has none to start from
            previous=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[].tagName')
            if [ -n "${previous}" ]; then
              echo
              gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="${TAG}" -f previous_tag_name="${previous}" --jq .body
            fi
          } > notes.md
          cat notes.md

      - name: Update the draft
        run: |
          prerelease=--prerelease=false
          case "${TAG}" in
            v0.* | *-*) prerelease=--prerelease ;;
          esac
          gh release edit "${TAG}" ${prerelease} --title "rtoskit-gcc ${TAG}" --notes-file notes.md
